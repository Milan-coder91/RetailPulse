apiVersion: apps/v1
kind: Deployment

metadata:
  name: retailpulse-dashboard

spec:
  replicas: 1

  selector:
    matchLabels:
      app: retailpulse-dashboard

  template:
    metadata:
      labels:
        app: retailpulse-dashboard

    spec:
      containers:
        - name: retailpulse-dashboard
          image: retailpulse-dashboard:latest

          ports:
            - containerPort: 8501

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"

          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 20